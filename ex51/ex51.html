<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Newborn Registration</title>
</head>
<body>

<form action="#" method="post"
      onsubmit="alert('Registration submitted.'); return false;"
      style="background-color: #008b84; width: 1000px; min-height: 850px; padding: 25px; border: 4px solid blue; color: white; font-size: 24px;">

    <center>
        <img src="Logo.gif" alt="St. Mary's of Northland Pines" width="700">
        <h1 style="font-family: Arial; font-size: 54px; color: white;">Newborn Registration</h1>
    </center>

    <p>
        Date:
        <input type="date" name="registerDate" style="background-color: white; width: 190px; font-size: 22px;">
    </p>

    <p>
        1) Infant's first name:
        <input type="text" name="infantFirstName" style="background-color: white; width: 230px; font-size: 22px;">
        Last:
        <input type="text" name="infantLastName" style="background-color: white; width: 230px; font-size: 22px;">
    </p>

    <p>
        2) Medical Record #:
        <input type="text" name="medicalRecord" style="background-color: white; width: 150px; font-size: 22px;">
    </p>

    <p>
        3) Date of birth:
        <input type="date" name="birthDate" style="background-color: white; width: 190px; font-size: 22px;">
    </p>

    <p>
        4) Birth weight:
        <input type="text" name="birthWeight" style="background-color: white; width: 150px; font-size: 22px;">
    </p>

    <p>
        5) APGAR score:
        <input type="text" name="apgarScore" style="background-color: white; width: 100px; font-size: 22px;">
    </p>

    <p>
        6) Mother's first name:
        <input type="text" name="motherFirstName" style="background-color: white; width: 230px; font-size: 22px;">
        Last:
        <input type="text" name="motherLastName" style="background-color: white; width: 230px; font-size: 22px;">
    </p>

    <p>
        7) Father's first name:
        <input type="text" name="fatherFirstName" style="background-color: white; width: 230px; font-size: 22px;">
        Last:
        <input type="text" name="fatherLastName" style="background-color: white; width: 230px; font-size: 22px;">
    </p>

    <p>
        8) Physician (check<br>
        &nbsp;&nbsp;&nbsp;&nbsp;all that apply:)
        <select name="physician" multiple size="4" style="background-color: white; width: 250px; font-size: 22px; vertical-align: top;">
            <option>Dr: Warren Albert</option>
            <option>Dr: Maria Alvarez</option>
            <option>Dr: Karen Brinkman</option>
            <option>Dr: Micheal Kerry</option>
        </select>
    </p>

    <center>
        <input type="submit" value="Register" style="font-size: 22px;">
        <input type="reset" value="Cancel" style="font-size: 22px;">
    </center>

</form>

</body>
</html>
