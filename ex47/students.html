<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Table with Style-trigger</title>

    <style type="text/css">
        table{
            width:90%;
            margin:auto;
            border-collapse:collapse;
            font-size:24px;
        }

        table, th, td{
            border:1px solid black;
        }

        th, td{
            padding:5px 12px;
        }

        thead, tfoot{
            background-color:#2f78b7;
            color:white;
        }

        thead th{
            text-align:center;
        }

        tbody tr:nth-child(2n+1){
            background-color:whitesmoke;
        }

        tbody tr:nth-child(2n){
            background-color:#fff2cc;
        }

        tbody tr:hover{
            background-color:yellow;
            cursor:pointer;
        }

        tfoot td{
            font-size:24px;
        }

        .number{
            text-align:center;
            width:50px;
        }

        .id{
            width:200px;
        }
    </style>
</head>

<body>

<table>
    <thead>
        <tr>
            <th class="number">#</th>
            <th class="id">Student ID</th>
            <th>Student Name</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td class="number">1</td>
            <td>123456</td>
            <td>Albert Einstein</td>
        </tr>

        <tr>
            <td class="number">2</td>
            <td>321232</td>
            <td>Niels Bohr</td>
        </tr>

        <tr>
            <td class="number">3</td>
            <td>987544</td>
            <td>Stephen Hawking</td>
        </tr>

        <tr>
            <td class="number">4</td>
            <td>359687</td>
            <td>Isaac Newton</td>
        </tr>

        <tr>
            <td class="number">5</td>
            <td>574878</td>
            <td>Nikola Tesla</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <td colspan="3">Designed by John</td>
        </tr>
    </tfoot>
</table>

</body>
</html>
