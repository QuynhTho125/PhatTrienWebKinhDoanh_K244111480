<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Table with Style-trigger</title>

    <link rel="stylesheet" type="text/css" href="mainstyle.css">
</head>

<body>

<table>

    <thead>
        <tr>
            <th class="number">#</th>
            <th class="id">Student ID</th>
            <th>Student Name</th>
        </tr>
    </thead>

    <tbody>

        <tr>
            <td class="number">1</td>
            <td>123456</td>
            <td>Albert Einstein</td>
        </tr>

        <tr>
            <td class="number">2</td>
            <td>321232</td>
            <td>Niels Bohr</td>
        </tr>

        <tr>
            <td class="number">3</td>
            <td>987544</td>
            <td>Stephen Hawking</td>
        </tr>

        <tr>
            <td class="number">4</td>
            <td>359687</td>
            <td>Isaac Newton</td>
        </tr>

        <tr>
            <td class="number">5</td>
            <td>574878</td>
            <td>Nikola Tesla</td>
        </tr>

    </tbody>

    <tfoot>
        <tr>
            <td colspan="3">
                Designed by John
            </td>
        </tr>
    </tfoot>

</table>

</body>
</html>
