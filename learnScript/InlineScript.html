<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Title</title>
</head>
<body>
    <form name="myForm">
        <h3>Select language</h3>

        <input type="radio" name="language" value="vi" id="rad1" checked

        onclick="id_div_vi.style.display='block';
                 id_div_korea.style.display='none';
                 id_div_jp.style.display='none';
                 id_div_cn.style.display='none';">
        <label for="rad1">Vietnamese</label><br>
<!-- checked dùng để chọn sẵn Vietnamese khi mở trang -->
        <input type="radio" name="language" value="korea" id="rad2"
        onclick="id_div_vi.style.display='none';
                 id_div_korea.style.display='block';
                 id_div_jp.style.display='none';
                 id_div_cn.style.display='none';">
        <label for="rad2">한국어</label><br>

        <input type="radio" name="language" value="jp" id="rad3"
        onclick="id_div_vi.style.display='none';
                 id_div_korea.style.display='none';
                 id_div_jp.style.display='block';
                 id_div_cn.style.display='none';">
        <label for="rad3">日本語</label><br>

        <input type="radio" name="language" value="cn" id="rad4"
        onclick="id_div_vi.style.display='none';
                 id_div_korea.style.display='none';
                 id_div_jp.style.display='none';
                 id_div_cn.style.display='block';">
        <label for="rad4">中文</label><br>

        <div id="id_div_vi" style="display:block">
            <h4>Xin chào</h4>
        </div>

        <div id="id_div_korea" style="display:none">
            <h4>안녕하세요</h4>
        </div>

        <div id="id_div_jp" style="display:none">
            <h4>こんにちは</h4>
        </div>

        <div id="id_div_cn" style="display:none">
            <h4>你好</h4>
        </div>
    </form>
</body>
</html>
