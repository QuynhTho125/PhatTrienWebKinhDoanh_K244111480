<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Title</title>

    <script>
        function showLanguage(id) {
            id_div_vi.style.display = "none";
            id_div_korea.style.display = "none";
            id_div_jp.style.display = "none";
            id_div_cn.style.display = "none";

            id.style.display = "block";
        }
    </script>
</head>

<body>
    <form name="myForm">
        <h3>Select language</h3>

        <input type="radio" name="language" id="rad1" checked onclick="showLanguage(id_div_vi)">
        <label for="rad1">Vietnamese</label><br>

        <input type="radio" name="language" id="rad2" onclick="showLanguage(id_div_korea)">
        <label for="rad2">한국어</label><br>

        <input type="radio" name="language" id="rad3" onclick="showLanguage(id_div_jp)">
        <label for="rad3">日本語</label><br>

        <input type="radio" name="language" id="rad4" onclick="showLanguage(id_div_cn)">
        <label for="rad4">中文</label><br>

        <div id="id_div_vi" style="display:block">
            <h4>Xin chào</h4>
        </div>

        <div id="id_div_korea" style="display:none">
            <h4>안녕하세요</h4>
        </div>

        <div id="id_div_jp" style="display:none">
            <h4>こんにちは</h4>
        </div>

        <div id="id_div_cn" style="display:none">
            <h4>你好</h4>
        </div>
    </form>
</body>
</html>
